[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zil-ai"
version = "0.1.17"
description = "A framework for production AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "FluentData", email = "hello@fluentdata.co" },
]
keywords = ["ai", "agents", "adk", "a2a", "mcp", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "click>=8.1,<9",
    "rich>=13.0,<14",
    "pydantic>=2.0,<3",
    "jsonschema>=4.20,<5",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1,<4",
    "oras>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]
adk = [
    "google-adk>=1.20.0",
    "mcp>=1.0.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
eval = [
    "deepeval>=2.0,<3",
]

[project.scripts]
zil = "zil.cli:cli"

[project.urls]
Homepage = "https://getzil.dev"
Repository = "https://github.com/fluentdata-co/zil"
Documentation = "https://getzil.dev/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/zil"]

[tool.hatch.build.targets.sdist]
exclude = ["artifacts/", "docs/", "website/", ".windsurf/"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
