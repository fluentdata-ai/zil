version: "1"

metadata:
  name: svt-openhands
  version: 0.1.0
  description: SVT coding agent — OpenHands backend with zil serve

spec:
  runtime:
    framework: openhands
    service:
      webhooks:
        - name: jira
          path: /webhooks/jira
          signature_header: X-Hub-Signature
          algorithm: sha256
          secret_env: JIRA_WEBHOOK_SECRET

  identity: ./identity

  env:
    - name: LLM_API_KEY
      description: LLM API key for the model provider
      required: true
      secret: true
    - name: JIRA_WEBHOOK_SECRET
      description: Secret for verifying Jira webhook signatures
      required: false
      secret: true

  tools:
    mcp_servers:
      - name: jira
        command: npx
        args: ["-y", "@anthropic/jira-mcp-server"]
        env:
          JIRA_API_TOKEN: "${JIRA_API_TOKEN}"
          JIRA_BASE_URL: "${JIRA_BASE_URL}"

  # No app.py needed — zil serve handles everything
