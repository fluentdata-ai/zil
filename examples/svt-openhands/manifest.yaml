version: "1"

metadata:
  name: svt-openhands
  version: 0.1.0
  description: SVT coding agent — OpenHands backend with zil serve

spec:
  runtime:
    framework: openhands
    service:
      webhooks:
        - name: jira
          path: /webhooks/jira
          signature_header: X-Hub-Signature
          algorithm: sha256
          secret_env: JIRA_WEBHOOK_SECRET

  identity: ./identity

  env:
    - name: LLM_API_KEY
      description: LLM API key for the model provider
      required: true
      secret: true
    - name: GITHUB_REPO_URL
      description: URL of the target repo to clone for each task
      required: true
    - name: GITHUB_TOKEN
      description: GitHub PAT for authenticated cloning and PR creation
      required: false
      secret: true
    - name: GITHUB_DEFAULT_BASE_BRANCH
      description: Branch to clone and base PRs from (default dev)
      required: false
    - name: JIRA_MCP_COMMAND
      description: Command to run the Jira MCP server (e.g. uvx or npx)
      required: true
    - name: JIRA_BASE_URL
      description: Jira instance URL (e.g. https://your-org.atlassian.net)
      required: true
    - name: JIRA_API_TOKEN
      description: Atlassian API token for Jira access
      required: true
      secret: true
    - name: JIRA_WEBHOOK_SECRET
      description: Secret for verifying Jira webhook signatures
      required: false
      secret: true

  tools:
    mcp_servers:
      - name: jira
        transport: stdio
        command: "${JIRA_MCP_COMMAND}"
        args:
          - "mcp-server-jira"
          - "--jira-base-url"
          - "${JIRA_BASE_URL}"
          - "--jira-token"
          - "${JIRA_API_TOKEN}"
        timeout: 30

  # No app.py needed — zil serve handles everything
