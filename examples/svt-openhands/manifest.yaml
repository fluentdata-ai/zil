apiVersion: "zil/v1"
kind: Agent

metadata:
  name: svt-openhands
  version: 0.1.1
  description: SVT coding agent — OpenHands backend with zil serve

spec:
  runtime:
    framework: openhands
    language: python
    llm:
      adapter: ./adapters/llm.yaml
    dependencies:
      - name: git
        type: apt
      - name: tmux
        type: apt
    service:
      webhooks:
        - name: jira
          path: /webhooks/jira
          signature_header: X-Hub-Signature
          algorithm: sha256
          secret_env: JIRA_WEBHOOK_SECRET

  identity: ./identity
  skills: ./skills
  memory: ./adapters/memory.yaml

  env:
    - name: LLM_API_KEY
      description: LLM API key for the model provider
      required: true
      secret: true
    - name: MEM0_API_KEY
      description: Mem0 API key for long-term/shared memory (managed mode)
      required: false
      secret: true
    - name: MEM0_ORG_ID
      description: Mem0 organization id (part of the shared-pool connection)
      required: false
    - name: MEM0_PROJECT_ID
      description: Mem0 project id (part of the shared-pool connection)
      required: false
    - name: GITHUB_REPO_URL
      description: URL of the target repo to clone for each task
      required: true
    - name: GITHUB_TOKEN
      description: GitHub PAT for authenticated cloning and PR creation
      required: false
      secret: true
    - name: GITHUB_DEFAULT_BASE_BRANCH
      description: Branch to clone and base PRs from (default dev)
      required: false
    - name: JIRA_MCP_COMMAND
      description: Command to run the Jira MCP server (e.g. uvx or npx)
      required: true
    - name: JIRA_BASE_URL
      description: Jira instance URL (e.g. https://your-org.atlassian.net)
      required: true
    - name: JIRA_API_TOKEN
      description: Atlassian API token for Jira access
      required: true
      secret: true
    - name: JIRA_WEBHOOK_SECRET
      description: Secret for verifying Jira webhook signatures
      required: false
      secret: true
    - name: JIRA_USER_EMAIL
      description: Jira user email for API authentication
      required: false

  tools:
    mcp_servers:
      - name: jira
        transport: stdio
        command: "${JIRA_MCP_COMMAND}"
        args:
          - "mcp-atlassian"
          - "--jira-url"
          - "${JIRA_BASE_URL}"
          - "--jira-username"
          - "${JIRA_USER_EMAIL}"
          - "--jira-token"
          - "${JIRA_API_TOKEN}"
        timeout: 30

  # No app.py needed — zil serve handles everything
