<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="6" fill="#e8c87a">
    <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="16" r="6" fill="#e8c87a" opacity="0.3">
    <animate attributeName="r" values="6;8;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
